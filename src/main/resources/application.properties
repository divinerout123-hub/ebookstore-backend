spring.application.name=ebookstore-backend
server.port=8080

# ---- PostgreSQL ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookstore}
spring.datasource.username=${DB_USERNAME:divinerout}
# Password: set SPRING_DATASOURCE_PASSWORD in the environment (unset = passwordless local login)
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- Pagination ----
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ---- JWT (secret must be Base64, at least 256 bits; override via JWT_SECRET) ----
app.jwt.secret=${JWT_SECRET:Ym9va3N0b3JlLXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LW9ubHktY2hhbmdlLWluLXByb2R1Y3Rpb24tMTIzNA==}
app.jwt.expiration-seconds=3600

# ---- CORS ----
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200

# ---- Order pricing ----
app.order.tax-rate=0.08
app.order.shipping-cost=5.99
app.order.free-shipping-threshold=50.00

# ---- JWT auth only: skip Spring's default in-memory user (and its generated password) ----
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
